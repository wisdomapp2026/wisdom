<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="120" fill="url(#bg-grad)"/>

  <!-- Subtle Inner Glow Ring -->
  <rect x="16" y="16" width="480" height="480" rx="104" fill="none" stroke="white" stroke-opacity="0.2" stroke-width="12"/>

  <!-- Main Icon Group -->
  <g filter="url(#shadow)">
    <!-- Graduation Cap Base / Diamond Top -->
    <polygon points="256,120 420,200 256,280 92,200" fill="white"/>
    
    <!-- Under Cap Body -->
    <path d="M152 245 V330 C152 375, 360 375, 360 330 V245" stroke="white" stroke-width="28" stroke-linecap="round" fill="none"/>
    
    <!-- Tassel Side Ribbon -->
    <path d="M400 210 V340 C400 355 390 365 375 365" stroke="url(#gold-grad)" stroke-width="20" stroke-linecap="round" fill="none"/>
    <circle cx="375" cy="375" r="16" fill="url(#gold-grad)"/>
    
    <!-- Central Lightning Spark / Star -->
    <polygon points="256,170 270,210 310,210 278,235 290,275 256,250 222,275 234,235 202,210 242,210" fill="url(#gold-grad)"/>
  </g>
</svg>
