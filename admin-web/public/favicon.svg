<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="admin-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="50%" stop-color="#312E81"/>
      <stop offset="100%" stop-color="#4338CA"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="gold-star" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="120" fill="url(#admin-grad)"/>
  <rect x="16" y="16" width="480" height="480" rx="104" fill="none" stroke="white" stroke-opacity="0.15" stroke-width="12"/>

  <!-- Main Icon Group -->
  <g filter="url(#shadow)">
    <!-- Graduation Cap Top -->
    <polygon points="256,110 420,190 256,270 92,190" fill="white"/>
    <!-- Under Cap Body -->
    <path d="M152 235 V315 C152 360, 360 360, 360 315 V235" stroke="white" stroke-width="26" stroke-linecap="round" fill="none"/>
    
    <!-- Admin Crown / Spark -->
    <path d="M256 310 L280 370 L340 370 L290 405 L310 460 L256 425 L202 460 L222 405 L172 370 L232 370 Z" fill="url(#gold-star)"/>
  </g>
</svg>